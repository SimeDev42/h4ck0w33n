name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; newer pushes cancel older ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache-bust assets in HTML
        run: |
          python3 - <<'PY'
          import hashlib, os, re
          from pathlib import Path

          # Collect site files without descending into dot-dirs or _site.
          files = []
          for dirpath, dirnames, filenames in os.walk("."):
              dirnames[:] = [d for d in dirnames if not d.startswith(".") and d != "_site"]
              for name in filenames:
                  if name.startswith("."):
                      continue
                  files.append(Path(dirpath) / name)

          # Hash every css/js/svg by filename (HTML references them by name).
          hashes = {
              p.name: hashlib.sha256(p.read_bytes()).hexdigest()[:8]
              for p in files
              if p.suffix in (".css", ".js", ".svg")
          }

          # Rewrite every HTML page, wherever it lives (root or subfolders).
          for page in [p for p in files if p.suffix == ".html"]:
              html = page.read_text()
              for asset, version in hashes.items():
                  # Replace an existing ?v=... value.
                  html = re.sub(
                      re.escape(asset) + r"\?v=[0-9A-Za-z]+",
                      asset + "?v=" + version,
                      html,
                  )
                  # If the asset had no query string yet, add one.
                  if (asset + "?v=") not in html:
                      html = html.replace(asset + '"', asset + "?v=" + version + '"')
              page.write_text(html)

          print("versions:", hashes)
          PY
          # Show the result for easy debugging in the Action log.
          grep -rnE --include='*.html' --exclude-dir=.git '\.(css|js|svg)\?v=' .

      - name: Stage site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            ./ _site/
          find _site -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
